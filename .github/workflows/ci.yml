name: SmartScout CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: SmartScoutIntegrationTestDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d SmartScoutIntegrationTestDb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartScout.slnx

      - name: Build Release configuration
        run: dotnet build SmartScout.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test SmartScout.UnitTests/SmartScout.UnitTests.csproj -c Release --no-build --verbosity normal

      - name: Run PostgreSQL integration tests
        env:
          SMARTSCOUT_TEST_CONNECTION: "Host=localhost;Port=5432;Database=SmartScoutIntegrationTestDb;Username=postgres;Password=ci_test_password"
        run: dotnet test SmartScout.IntegrationTests/SmartScout.IntegrationTests.csproj -c Release --no-build --verbosity normal

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-validation-password
          SMARTSCOUT_API_KEY: ci-validation-api-key
        run: docker compose config --quiet
